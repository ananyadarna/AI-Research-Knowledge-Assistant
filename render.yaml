services:
  - type: web
    name: ai-research-knowledge-assistant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: local
      - key: OPENAI_API_KEY
        sync: false
